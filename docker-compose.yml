services:
  kafka-storage-init:
    image: alpine:3.20
    container_name: evm-kafka-storage-init

    user: "0:0"

    command:
      - sh
      - -c
      - chown -R 1000:1000 /kafka-data

    volumes:
      - kafka_data:/kafka-data

    restart: "no"


  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: evm-kafka

    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully

    ports:
      - "9092:9092"

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      # Local development disk safety. All current topics use one partition,
      # so the default 2 GiB cap limits retained data per topic partition.
      # Increase these values for production or long-running backlog tests.
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-2147483648}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-268435456}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: ${KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS:-60000}

      KAFKA_LISTENERS: >-
        INTERNAL://0.0.0.0:19092,
        EXTERNAL://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:19092,
        EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server localhost:19092
          --list > /dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

    restart: unless-stopped


  kafka-init:
    image: apache/kafka:4.3.1
    container_name: evm-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      - /bin/bash
      - -c

    command: |
      echo "Kafka hazır. Topic'ler oluşturuluyor..."

      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:19092 \
        --create \
        --if-not-exists \
        --topic evm.raw \
        --partitions 1 \
        --replication-factor 1

      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:19092 \
        --create \
        --if-not-exists \
        --topic evm.normalized \
        --partitions 1 \
        --replication-factor 1

      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:19092 \
        --create \
        --if-not-exists \
        --topic evm.dlq \
        --partitions 1 \
        --replication-factor 1

      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:19092 \
        --create \
        --if-not-exists \
        --topic canonical-events \
        --partitions 1 \
        --replication-factor 1

      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:19092 \
        --create \
        --if-not-exists \
        --topic evm.retry_writer \
        --partitions 1 \
        --replication-factor 1

      echo "Kafka topic'leri hazır."

    restart: "no"


  redis:
    image: redis:7.4.10-alpine3.21
    container_name: evm-redis

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  clickhouse:
    image: clickhouse/clickhouse-server:26.5.6
    container_name: evm-clickhouse

    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: evm
      CLICKHOUSE_USER: evm_userMehmet
      CLICKHOUSE_PASSWORD: evm_passMehmet
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - >
          wget --no-verbose --tries=1
          --spider http://localhost:8123/ping
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    restart: unless-stopped


  ingestion:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile

    container_name: evm-ingestion

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_URL: redis://redis:6379/0
      BLOCK_QUEUE_MAX_SIZE: 20
      BACKFILL_CONCURRENCY: 5
      INGESTION_TARGET_EVENTS_PER_SECOND: 900

    ports:
      - "8000:8000"

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped


  normalizer:
    build:
      context: ./normalizer-service
      dockerfile: Dockerfile

    container_name: evm-normalizer

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_RAW_TOPIC: evm.raw
      KAFKA_NORMALIZED_TOPIC: evm.normalized
      KAFKA_DLQ_TOPIC: evm.dlq
      NORMALIZER_CONSUMER_GROUP: normalizer-service
      NORMALIZER_SCHEMA_VERSION: 1
      NORMALIZER_MONITORING_PORT: 8001

    ports:
      - "8001:8001"

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped


  reorg:
    build:
      context: ./reorg-service
      dockerfile: Dockerfile

    container_name: evm-reorg

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_NORMALIZED_TOPIC: evm.normalized
      KAFKA_CANONICAL_TOPIC: canonical-events
      KAFKA_DLQ_TOPIC: evm.dlq

      REORG_CONSUMER_GROUP: reorg-service
      REORG_WINDOW_SIZE: 50
      REORG_PENDING_TTL_SECONDS: 120
      REORG_SCHEMA_VERSION: 1
      REORG_MONITORING_PORT: 8002

      REDIS_URL: redis://redis:6379/0

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    ports:
      - "8002:8002"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  batch-writer:
    build:
      context: ./batch-writer-service
      dockerfile: Dockerfile

    container_name: evm-batch-writer

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_CANONICAL_TOPIC: canonical-events
      KAFKA_RETRY_WRITER_TOPIC: evm.retry_writer
      KAFKA_DLQ_TOPIC: evm.dlq

      BATCH_WRITER_CONSUMER_GROUP: batch-writer-service
      BATCH_WRITER_BATCH_SIZE: 2000
      BATCH_WRITER_FLUSH_INTERVAL_SECONDS: 3

      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: evm
      CLICKHOUSE_USER: evm_userMehmet
      CLICKHOUSE_PASSWORD: evm_passMehmet

      BATCH_WRITER_MONITORING_PORT: 8003

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

    ports:
      - "8003:8003"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped


  reconciliation:
    build:
      context: ./reconciliation-service
      dockerfile: Dockerfile

    container_name: evm-reconciliation

    env_file:
      - .env

    environment:
      CHAIN_ID: 56

      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: evm
      CLICKHOUSE_USER: evm_userMehmet
      CLICKHOUSE_PASSWORD: evm_passMehmet

      RECONCILIATION_INTERVAL_SECONDS: 30
      RECONCILIATION_WINDOW_SIZE: 20
      RECONCILIATION_MONITORING_PORT: 8004

    depends_on:
      clickhouse:
        condition: service_healthy

    ports:
      - "8004:8004"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: evm-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: evm-grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

    restart: unless-stopped


volumes:
  kafka_data:
  redis_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
