services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: evm-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        INTERNAL://0.0.0.0:19092,
        EXTERNAL://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:19092,
        EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server localhost:19092
          --list > /dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

    restart: unless-stopped


  kafka-init:
    image: apache/kafka:4.3.1
    container_name: evm-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      - /bin/bash
      - -c

    command: |
      echo "Kafka hazır. Topic'ler oluşturuluyor..."

      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:19092 \
        --create \
        --if-not-exists \
        --topic evm.raw \
        --partitions 1 \
        --replication-factor 1

      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:19092 \
        --create \
        --if-not-exists \
        --topic evm.normalized \
        --partitions 1 \
        --replication-factor 1

      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:19092 \
        --create \
        --if-not-exists \
        --topic evm.dlq \
        --partitions 1 \
        --replication-factor 1

      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server kafka:19092 \
        --create \
        --if-not-exists \
        --topic canonical-events \
        --partitions 1 \
        --replication-factor 1

      echo "Kafka topic'leri hazır."

    restart: "no"


  redis:
    image: redis:7.4.10-alpine3.21
    container_name: evm-redis

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  clickhouse:
    image: clickhouse/clickhouse-server:26.5.6
    container_name: evm-clickhouse

    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: evm
      CLICKHOUSE_USER: evm_userMehmet
      CLICKHOUSE_PASSWORD: evm_passMehmet
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro

    restart: unless-stopped


  ingestion:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile

    container_name: evm-ingestion

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped


  normalizer:
    build:
      context: ./normalizer-service
      dockerfile: Dockerfile

    container_name: evm-normalizer

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_RAW_TOPIC: evm.raw
      KAFKA_NORMALIZED_TOPIC: evm.normalized
      KAFKA_DLQ_TOPIC: evm.dlq
      NORMALIZER_CONSUMER_GROUP: normalizer-service
      NORMALIZER_SCHEMA_VERSION: 1
      NORMALIZER_MONITORING_PORT: 8001

    ports:
      - "8001:8001"

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped

  reorg:
    build:
      context: ./reorg-service
    container_name: evm-reorg

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_NORMALIZED_TOPIC: evm.normalized
      KAFKA_CANONICAL_TOPIC: canonical-events
      KAFKA_DLQ_TOPIC: evm.dlq

      REORG_CONSUMER_GROUP: reorg-service
      REORG_WINDOW_SIZE: 50
      REORG_PENDING_TTL_SECONDS: 120
      REORG_SCHEMA_VERSION: 1
      REORG_MONITORING_PORT: 8002

      REDIS_URL: redis://redis:6379/0

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    ports:
      - "8002:8002"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  redis_data:
  clickhouse_data:
