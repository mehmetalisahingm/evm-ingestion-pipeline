global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "ingestion"
    static_configs:
      - targets:
          - "ingestion:8000"

  - job_name: "normalizer"
    static_configs:
      - targets:
          - "normalizer:8001"

  - job_name: "reorg"
    static_configs:
      - targets:
          - "reorg:8002"

  - job_name: "batch-writer"
    static_configs:
      - targets:
          - "batch-writer:8003"

  - job_name: "reconciliation"
    static_configs:
      - targets:
          - "reconciliation:8004"